services:
  bible-mcp:
    build:
      context: ..
      dockerfile: vps/Dockerfile.bible-mcp
    container_name: buck-bible-mcp
    networks:
      # caddy-public = public access for the OpenAI Responses MCP connector
      # (behind Caddy Bearer auth via MCP_SHARED_SECRET).
      - caddy-public
      - internal
    # Same env_file as buck-app: OPENAI_API_KEY + OPENAI_EMBEDDING_MODEL live
    # in /opt/buck-writer-app/.env (synced from vps/.env.production by
    # deploy.sh). Without this, ${VAR} substitutions in `environment` resolve
    # to blank because docker compose only reads vars from its own shell
    # invocation, not from any service's env_file.
    env_file: ../.env
    environment:
      BIBLE_DB_PATH: /app/data/bible.db
      BIBLE_HTTP_PORT: '7801'
      # NB: MCP_SHARED_SECRET intentionally NOT set here. The Bearer check
      # is enforced at the Caddy edge (bible-mcp.buck.*) for OpenAI. Bible
      # UI calls /mcp through an internal path (Caddy→bible-ui nginx→
      # bible-mcp) that doesn't inject the Bearer, so a container-level
      # check would lock the UI out of its own backend.
    volumes:
      - ../data/bible:/app/data
    restart: unless-stopped

  writing-tools-mcp:
    build:
      context: ..
      dockerfile: vps/Dockerfile.writing-tools-mcp
    container_name: buck-writing-tools-mcp
    networks:
      - caddy-public
      - internal
    restart: unless-stopped
    # env_file brings MCP_SHARED_SECRET from /opt/buck-writer-app/.env without
    # needing docker compose to inherit it from the deploy shell.
    env_file: ../.env
    # First start downloads torch / transformers / spacy model (~3 GB).
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --spider http://127.0.0.1:7802/mcp || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bible-ui:
    build:
      context: ..
      dockerfile: vps/Dockerfile.bible-ui
    container_name: buck-bible-ui
    restart: unless-stopped
    networks:
      - caddy-public
      - internal
    depends_on:
      - bible-mcp

  markitdown-worker:
    build:
      context: ../services/markitdown-worker
      dockerfile: Dockerfile
    container_name: buck-markitdown-worker
    restart: unless-stopped
    # Internal only — never exposed on caddy-public.
    networks:
      - internal
    # INTERNAL_TOKEN comes from /opt/buck-writer-app/.env (same file as buck-app).
    env_file: ../.env
    environment:
      INTERNAL_TOKEN: ${MARKITDOWN_INTERNAL_TOKEN}
      OCR_LANGS: fra+eng
      MAX_UPLOAD_MB: '20'
      CONVERT_TIMEOUT_S: '60'
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://localhost:8000/health || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  buck-app:
    image: buck-writer:local
    build:
      context: ..
      dockerfile: vps/Dockerfile.app
      args:
        VITE_BIBLE_UI_URL: ${VITE_BIBLE_UI_URL:-https://bible.buck.romain-ecarnot.com}
    container_name: buck-app
    restart: unless-stopped
    env_file: ../.env
    environment:
      - WEB_DIST_ROOT=/app/web-dist
      - WORKSPACE_DIR=/app/workspace
      - DATABASE_URL=file:/app/data/buck.db
      # Public URLs exposed to OpenAI for the MCP connectors. Must be HTTPS
      # with a valid Bearer (MCP_SHARED_SECRET) fronted by Caddy.
      - MCP_BIBLE_URL=${MCP_BIBLE_URL:-https://bible-mcp.buck.romain-ecarnot.com}
      - MCP_WRITING_TOOLS_URL=${MCP_WRITING_TOOLS_URL:-https://writing-mcp.buck.romain-ecarnot.com}
      - MCP_SHARED_SECRET=${MCP_SHARED_SECRET}
      # MarkItDown sidecar (M6). Uses the shared `internal` network.
      - MARKITDOWN_URL=http://buck-markitdown-worker:8000
      - MARKITDOWN_INTERNAL_TOKEN=${MARKITDOWN_INTERNAL_TOKEN}
      - MARKITDOWN_TIMEOUT_MS=65000
    volumes:
      - ../data/db:/app/data
      - ../data/workspace:/app/workspace
    networks:
      - caddy-public
      - internal
    depends_on:
      - bible-mcp
      - writing-tools-mcp
      - markitdown-worker
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O - http://127.0.0.1:3000/api/health || exit 1'
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  internal:
    driver: bridge
  caddy-public:
    external: true
