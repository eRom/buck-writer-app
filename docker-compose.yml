services:
  bible-mcp:
    build:
      context: .
      dockerfile: Dockerfile.bible-mcp
    networks:
      - internal
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BIBLE_DB_PATH: /app/data/bible.db
      BIBLE_HTTP_PORT: "7801"
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
    volumes:
      - ./data/bible:/app/data
    restart: unless-stopped

  buck-app:
    image: buck-writer:local
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: buck-app
    restart: unless-stopped
    env_file: .env
    environment:
      - WEB_DIST_ROOT=/app/web-dist
      - WORKSPACE_DIR=/app/workspace
      - DATABASE_URL=file:/app/data/buck.db
      - MCP_BIBLE_URL=http://bible-mcp:7801
    volumes:
      - ./data/db:/app/data
      - ./data/workspace:/app/workspace
    networks:
      - caddy-public
      - internal
    depends_on:
      - bible-mcp
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O - http://127.0.0.1:3000/api/health || exit 1'
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  internal:
    driver: bridge
  caddy-public:
    external: true
