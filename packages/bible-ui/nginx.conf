server {
    # Rootless nginx image binds unprivileged port 8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver Docker embedded DNS pour resolution lazy de bible-mcp
    # (sinon nginx refuse de demarrer si bible-mcp absent du reseau)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Public entry-point for the bible MCP server (gated by Caddy bearer upstream).
    # "internal" directive does NOT apply: this is a front-facing proxy, not an
    # X-Accel-Redirect target. Adding "internal" here would break routing.
    # The matching semgrep rule is excluded at workflow level (see security.yml).
    location /mcp {
        set $bible_upstream "http://bible-mcp:7801";
        proxy_pass $bible_upstream;
        # Force an explicit Host value: trusting $host/$http_host would let
        # a rogue request set an attacker-chosen Host on the upstream call
        # (cache-poisoning vector). Upstream is an internal container that
        # does not need the public hostname.
        proxy_set_header Host "bible-mcp:7801";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets immutables
    location ~* \.(js|css|woff2|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
