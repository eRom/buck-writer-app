server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver Docker embedded DNS pour resolution lazy de bible-mcp
    # (sinon nginx refuse de demarrer si bible-mcp absent du reseau)
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /mcp {
        set $bible_upstream "http://bible-mcp:7801";
        proxy_pass $bible_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets immutables
    location ~* \.(js|css|woff2|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
