name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan in case a new CVE lands on a pinned dep
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  semgrep:
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: |
          # generic.nginx.security.missing-internal.missing-internal : false positive.
          # Notre proxy_pass dans bible-ui/nginx.conf est un reverse-proxy public
          # front-facing, pas un X-Accel-Redirect target. "internal" casserait le
          # routage /mcp. Justification documentee inline dans nginx.conf.
          # Les `# nosemgrep` inline ne sont pas honores sur les fichiers nginx (mode
          # generic), d'ou l'exclusion au niveau workflow.
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/security-audit \
            --config p/jwt \
            --config p/sql-injection \
            --exclude-rule generic.nginx.security.missing-internal.missing-internal \
            --error \
            packages/

  gitleaks:
    # Dependabot PRs run with a read-only GITHUB_TOKEN; gitleaks-action attempts
    # to comment on the PR and fails with 403 on every rebase, spamming emails.
    # Version-bump PRs don't introduce secrets, so skipping is safe.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
