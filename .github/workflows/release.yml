name: release
on:
  push:
    tags: ['buck-v*']

jobs:
  build-push:
    name: Build and push ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: buck-app,                dockerfile: deploy-vps/Dockerfile.app,                context: . }
          - { name: buck-bible-mcp,          dockerfile: deploy-vps/Dockerfile.bible-mcp,          context: . }
          - { name: buck-bible-ui,           dockerfile: deploy-vps/Dockerfile.bible-ui,           context: . }
          - { name: buck-writing-tools-mcp,  dockerfile: deploy-vps/Dockerfile.writing-tools-mcp,  context: . }
          - { name: buck-markitdown-worker,  dockerfile: services/markitdown-worker/Dockerfile,    context: services/markitdown-worker }
    steps:
      - name: Free disk space (only for heavy images)
        if: matrix.image.name == 'buck-writing-tools-mcp'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: ver
        # buck-v1.2.3 -> v1.2.3
        run: echo "version=${GITHUB_REF_NAME#*-}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ghcr.io/erom/${{ matrix.image.name }}:${{ steps.ver.outputs.version }}
            ghcr.io/erom/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to:   type=gha,scope=${{ matrix.image.name }},mode=max

  dispatch:
    name: Trigger deploy on infra repo
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_PAT }}
          repository: eRom/vps-docker-manager-prod
          event-type: app-release
          client-payload: |
            {
              "app": "buck",
              "app_repo": "${{ github.repository }}",
              "tag": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "deploy_vps_ref": "${{ github.sha }}"
            }
