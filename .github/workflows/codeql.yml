name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan, Monday 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds higher-recall queries on top of the default
          # `security-and-quality` pack used by the GitHub default setup.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          # This is a private repo without GitHub Advanced Security, so the
          # SARIF cannot land in the Code scanning UI. We keep the scan
          # running for signal (job fails on critical findings) and publish
          # the SARIF as a workflow artifact for manual review. To enable the
          # full UI integration: enable GHAS in repo Settings or make the
          # repo public, then drop the `upload` line.
          upload: never
          output: codeql-results

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results/
          retention-days: 14
