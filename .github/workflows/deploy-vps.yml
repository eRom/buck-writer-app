name: deploy-vps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag vX.Y.Z or commit SHA)'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Determine deploy ref
        id: deploy_ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS
        env:
          DEPLOY_REF: ${{ steps.deploy_ref.outputs.ref }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_IP: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          echo "Deploying ref: $DEPLOY_REF to $REMOTE_USER@$REMOTE_IP"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_IP" bash <<EOF
            set -euo pipefail
            cd /opt/buck-writer-app
            git fetch --all --tags
            git reset --hard $DEPLOY_REF
            cd vps
            docker compose build
            docker compose up -d
            echo "Waiting 15s for containers to settle..."
            sleep 15
            docker compose ps
          EOF

      - name: Healthcheck
        run: |
          echo "Waiting 5s for Caddy..."
          sleep 5
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://buck.romain-ecarnot.com/api/health || echo "000")
          echo "buck.romain-ecarnot.com/api/health -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Healthcheck failed (HTTP $code)"
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deploy OK"
            echo ""
            echo "- **Ref** : \`${{ steps.deploy_ref.outputs.ref }}\`"
            echo "- **Healthcheck** : 200 OK"
            echo "- **URL** : https://buck.romain-ecarnot.com"
          } >> $GITHUB_STEP_SUMMARY

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
